        function getJulianDate(date) {
    return (date.getTime() / 86400000) + 2440587.5;
}

        function calculatePlanetPosition(name, date) {
    const el = JPL_DATA[name];
    if (!el) return { x: 0, z: 0 };

    const T = (getJulianDate(date) - 2451545.0) / 36525.0;
    
    const a = el.a0 + (el.a_dot * T);
    const e = el.e0 + (el.e_dot * T);
    const I = (el.I0 + (el.I_dot * T)) * Math.PI / 180;
    const L = (el.L0 + (el.L_dot * T)) * Math.PI / 180;
    const longPeri = (el.long_peri0 + (el.long_peri_dot * T)) * Math.PI / 180;
    const longNode = (el.long_node0 + (el.long_node_dot * T)) * Math.PI / 180;

    const w = longPeri - longNode;
    const M = L - longPeri;

    let E = M;
    for(let i=0; i<10; i++) {
        E = E + (M - (E - e * Math.sin(E))) / (1 - e * Math.cos(E));
    }

    const x_plane = a * (Math.cos(E) - e);
    const y_plane = a * Math.sqrt(1 - e * e) * Math.sin(E);

    const cosNode = Math.cos(longNode);
    const sinNode = Math.sin(longNode);
    const cosW_I = Math.cos(w);

    const x = (Math.cos(w) * Math.cos(longNode) - Math.sin(w) * Math.sin(longNode) * Math.cos(I)) * x_plane + (-Math.sin(w) * Math.cos(longNode) - Math.cos(w) * Math.sin(longNode) * Math.cos(I)) * y_plane;
    const y = (Math.cos(w) * Math.sin(longNode) + Math.sin(w) * Math.cos(longNode) * Math.cos(I)) * x_plane + (-Math.sin(w) * Math.sin(longNode) + Math.cos(w) * Math.cos(longNode) * Math.cos(I)) * y_plane;

    return { angle: Math.atan2(y, x) };
}

const sun = new THREE.Mesh(
    new THREE.SphereGeometry(22, 64, 64),

sun.userData = { name: "Sun" };
scene.add(sun);

solData.forEach((data) => {
    const orbitGroup = new THREE.Group();
    orbitGroup.rotation.y = Math.random() * Math.PI * 2;
    scene.add(orbitGroup);

    const ring = new THREE.Mesh(new THREE.RingGeometry(data.dist - 0.6, data.dist + 0.6, 256), new THREE.MeshBasicMaterial({ color: 0x00f2ff, side: THREE.DoubleSide, transparent: true, opacity: 0.3 }));
    ring.rotation.x = Math.PI / 2;
    scene.add(ring);

    const pMesh = new THREE.Mesh(
        new THREE.SphereGeometry(data.size, 64, 64), 
        new THREE.MeshStandardMaterial({ map: textures[data.name] })
    );
    pMesh.rotation.z = data.axialTilt;
    pMesh.position.x = data.dist;
    pMesh.userData = { name: data.name };
    orbitGroup.add(pMesh);

    if(data.hasRings) {
        let ringTexture = data.name === 'Saturn' ? textures.SaturnRing : textures.UranusRing;
        const sRing = new THREE.Mesh(
            new THREE.RingGeometry(data.size * 1.4, data.size * 2.5, 64), 
            new THREE.MeshStandardMaterial({ 
                map: ringTexture, 
                side: THREE.DoubleSide, 
                transparent: true, 
                opacity: 0.8 
            })
        );
        sRing.rotation.x = Math.PI / 2.2;
        pMesh.add(sRing);
    }

            data.moons.forEach(m => {
                const mOrbit = new THREE.Group(); 
                pMesh.add(mOrbit);
                const mMsh = new THREE.Mesh(new THREE.SphereGeometry(m.size, 32, 32), new THREE.MeshStandardMaterial({ color: m.color }));
                mMsh.position.x = m.dist; 
                mOrbit.add(mMsh);
                moonObjects.push({ group: mOrbit, speed: m.speed });
            });

            const planetEntry = {
    group: orbitGroup,
    mesh: pMesh,
    speed: data.speed,
    orbitRadius: data.dist,
    orbitAngle: Math.random() * Math.PI * 2,
    rotationSpeed: data.speed * 0.4,
    name: data.name
};

            planets.push(planetEntry);
            planetObjects[data.name] = planetEntry;
        });

        const sunLight = new THREE.PointLight(0xffffff, 800, 2000, 1.2);
        scene.add(sunLight);
        scene.add(new THREE.AmbientLight(0xffffff, 0.2));
        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(30000);
        for(let i=0; i<30000; i++) starPos[i] = (Math.random() - 0.5) * 4500;
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ size: 1.5, color: 0xffffff })));

        camera.position.set(0, 350, 550);
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        

function updatePlanetPositions() {
    planets.forEach(p => {
        const res = calculatePlanetPosition(p.name, currentSimulationDate);
        p.orbitAngle = res.angle;
        p.mesh.position.x = Math.cos(p.orbitAngle) * p.orbitRadius;
        p.mesh.position.z = Math.sin(p.orbitAngle) * p.orbitRadius;
    });

}

        function simulateOrbitalMotion(delta) {
            sun.rotation.y += sunRotationSpeed * 0.01 * simulationSpeed * delta;
    planets.forEach(p => {

        p.orbitAngle += p.speed * 0.00008 * simulationSpeed * delta;

        const radius = Math.sqrt(
            (p.mesh.position.x * p.mesh.position.x) +
            (p.mesh.position.z * p.mesh.position.z)
        );

        p.mesh.position.x = Math.cos(p.orbitAngle) * radius;
        p.mesh.position.z = Math.sin(p.orbitAngle) * radius;
        
        if (p.name === "Earth") {
            const hours = currentSimulationDate.getHours();
            const minutes = currentSimulationDate.getMinutes();
            const totalHours = hours + (minutes / 60);
            
            const timeAngle = (totalHours / 24) * Math.PI * 2;
            const baseAlignment = Math.PI * 1.95; 
            
            // This cleanly rotates the texture relative to the current simulation time
            p.mesh.rotation.y = baseAlignment - timeAngle;
        }else{p.mesh.rotation.y += p.rotationSpeed * 0.01 * simulationSpeed * delta;}
    });

    moonObjects.forEach(m => {
        m.group.rotation.y += m.speed * 0.01 * simulationSpeed * delta;
    });
}

const speedSlider = document.getElementById('speed-slider');
const speedLabel = document.getElementById('speed-label');
speedSlider.addEventListener('input', () => {
    simulationSpeed = parseFloat(speedSlider.value);
    speedLabel.innerText = simulationSpeed + 'x';
});

document.getElementById('present-btn').onclick = () => {
    liveTrackingEnabled = true;
    currentSimulationDate = new Date();
    updatePlanetPositions();
    document.getElementById('date-input').value=null;
};

document.getElementById('jump-btn').onclick = () => {
    const val = document.getElementById('date-input').value;
    if(!val) return;
    liveTrackingEnabled = false;
    currentSimulationDate = new Date(val);
    updatePlanetPositions();
};

const clock = new THREE.Clock();
function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta() * 60;
    simulateOrbitalMotion(delta);

    if (selectedPlanet) {
        const worldPos = new THREE.Vector3();
        selectedPlanet.getWorldPosition(worldPos);
        controls.target.lerp(worldPos, 0.1);
    }
    controls.update();
    renderer.render(scene, camera);
}

animate();
updatePlanetPositions();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
window.addEventListener('click', (event) => {
    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const targetsToIntersect = [sun, ...planets.map(p => p.mesh)];
    const hits = raycaster.intersectObjects(targetsToIntersect);
    if (hits.length > 0) {
        selectedPlanet = hits[0].object;
        const pName = selectedPlanet.userData.name ? selectedPlanet.userData.name : "Sun";
        const stats = planetFacts[pName];
        document.getElementById('data-box').style.display = 'block';
        document.getElementById('planet-name').innerText = pName.toUpperCase();
        document.getElementById('val-mass').innerText = stats.mass;
        document.getElementById('val-grav').innerText = stats.grav;
        document.getElementById('val-dens').innerText = stats.dens;
        document.getElementById('val-age').innerText = stats.age;
        if (pName === "Sun") {
            document.querySelector('#data-box .data-grid div:nth-child(5) .data-label').innerHTML = "Satellites:";
            document.querySelector('#moon-list-area .data-label').innerHTML = "System Core:";
        } else {
            document.querySelector('#data-box .data-grid div:nth-child(5) .data-label').innerHTML = "Total Moons:";
            document.querySelector('#moon-list-area .data-label').innerHTML = "Major Moons:";
        }
        document.getElementById('val-moons').innerText = stats.actualMoonCount;
        document.getElementById('moon-names').innerText = stats.majorMoons;
        document.getElementById('planet-desc').innerText = stats.desc;
        statusDisplay.innerText = "TRACKING";
        statusDisplay.style.color = "#00ff88";
    }

});
document.getElementById('reset-btn').onclick = () => {
    selectedPlanet = null;
    controls.target.set(0, 0, 0);
    document.getElementById('data-box').style.display = 'none';
    statusDisplay.innerText = "SCANNING";
    statusDisplay.style.color = "#ffaa00";
};
    </script>
</body>
</html>
